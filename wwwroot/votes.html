<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Beg1nnnerOS — опросы и прогнозы</title>
<style>
  :root { --accent:#9146ff; --bg:rgba(16,16,22,.82); --fg:#fff; --muted:#b9b9c6; --blue:#3b82f6; --pink:#ec4899; }
  html, body { margin:0; background:transparent; font-family:"Segoe UI", Inter, system-ui, sans-serif; color:var(--fg); overflow:hidden; }
  body.preview { background:repeating-conic-gradient(#20202a 0 25%, #1a1a22 0 50%) 0 0/30px 30px; }
  #box { position:absolute; left:16px; top:16px; width:calc(100vw - 32px); max-width:620px; box-sizing:border-box;
    background:var(--bg); border-radius:16px; padding:16px 18px 14px; box-shadow:0 10px 34px #0008; border:1px solid #ffffff14;
    transform:translateY(-14px) scale(.97); opacity:0; transition:opacity .45s, transform .45s cubic-bezier(.2,.9,.3,1.3); }
  #box.show { opacity:1; transform:none; }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .kind { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .timer { margin-left:auto; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; background:#ffffff14; padding:3px 10px; border-radius:999px; }
  .timer.lock { background:#f59e0b33; color:#fde68a; } .timer.done { background:#22c55e33; color:#bbf7d0; }
  h1 { font-size:24px; margin:0 0 12px; line-height:1.2; text-shadow:0 2px 6px #0007; }
  .row { margin:10px 0; position:relative; }
  .bar { position:relative; height:38px; border-radius:10px; background:#ffffff12; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg, var(--c, var(--accent)), color-mix(in srgb, var(--c, var(--accent)) 70%, #fff));
    border-radius:10px; transition:width .8s cubic-bezier(.2,.8,.2,1); opacity:.85; }
  .bar .t { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:18px; font-weight:600; text-shadow:0 1px 4px #000a; }
  .bar .t b { font-variant-numeric:tabular-nums; }
  .sub { font-size:13px; color:var(--muted); margin:3px 2px 0; }
  .row.win .bar { box-shadow:0 0 0 2px #facc15, 0 0 18px #facc1566; }
  .row.lose { opacity:.55; }
  .foot { font-size:13px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div id="box"></div>
<script>
// Источник для OBS: живые результаты опроса или прогноза Twitch. Параметры: ?preview=1 — демо-данные.
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.get("preview") === "1";
if (PREVIEW) document.body.classList.add("preview");
if (Q.get("accent")) document.documentElement.style.setProperty("--accent", Q.get("accent"));
const box = document.getElementById("box");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Math.round(n).toLocaleString("ru-RU");
let shownKey = "";

function left(t) {
  const s = Math.max(0, Math.round(t - Date.now() / 1000));
  return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `0:${String(s).padStart(2, "0")}`;
}
function plural(n, a, b, c) { const x = n % 100, y = x % 10; return x > 10 && x < 20 ? c : y === 1 ? a : y >= 2 && y <= 4 ? b : c; }

function pick(v) {
  // что показывать: активное важнее завершённого; завершённое — ещё hide_sec секунд
  const now = Date.now() / 1000, hide = v.overlay.hide_sec;
  const p = v.poll, r = v.prediction;
  const pLive = p && p.active, rLive = r && (r.active || r.locked);
  if (rLive && (!pLive || r.created > p.started)) return ["pred", r];
  if (pLive) return ["poll", p];
  const fresh = [];
  if (p && p.ended && now - p.ended < hide) fresh.push(["poll", p, p.ended]);
  if (r && r.ended && now - r.ended < hide && r.status !== "CANCELED") fresh.push(["pred", r, r.ended]);
  fresh.sort((a, b) => b[2] - a[2]);
  return fresh[0] || null;
}

function render(v) {
  const cur = pick(v);
  if (!cur) { box.classList.remove("show"); return; }
  const [kind, d] = cur;
  const key = kind + d.id;
  let html;
  if (kind === "poll") {
    const max = Math.max(...d.choices.map(c => c.votes));
    const timer = d.active ? `<span class="timer">${left(d.ends)}</span>` : `<span class="timer done">итог</span>`;
    html = `<div class="head"><span class="kind">📊 Опрос</span>${timer}</div><h1>${esc(d.title)}</h1>
      ${d.choices.map(c => {
        const win = !d.active && max > 0 && c.votes === max;
        return `<div class="row ${win ? "win" : !d.active && max > 0 ? "lose" : ""}"><div class="bar"><i style="width:${c.pct}%"></i>
          <div class="t"><span>${win ? "🏆 " : ""}${esc(c.title)}</span><b>${c.pct}%</b></div></div></div>`;
      }).join("")}
      <div class="foot">${d.total} ${plural(d.total, "голос", "голоса", "голосов")}${d.active ? " · голосуйте в чате Twitch" : ""}</div>`;
  } else {
    const done = d.status === "RESOLVED";
    const timer = d.active ? `<span class="timer">${left(d.locks)}</span>` : d.locked ? `<span class="timer lock">🔒 ставки закрыты</span>` : `<span class="timer done">итог</span>`;
    const pts = v.overlay.show_points;
    const colors = d.outcomes.length === 2 ? ["var(--blue)", "var(--pink)"] : [];
    html = `<div class="head"><span class="kind">🔮 Прогноз</span>${timer}</div><h1>${esc(d.title)}</h1>
      ${d.outcomes.map((o, i) => {
        const win = done && d.winner === o.id;
        const c = colors[i] || (o.color === "pink" ? "var(--pink)" : "var(--blue)");
        return `<div class="row ${win ? "win" : done ? "lose" : ""}"><div class="bar" style="--c:${c}"><i style="width:${o.pct}%"></i>
          <div class="t"><span>${win ? "🏆 " : ""}${esc(o.title)}</span><b>${o.pct}%</b></div></div>
          <div class="sub">${o.users} ${plural(o.users, "участник", "участника", "участников")}${pts ? ` · ${num(o.points)} баллов` : ""}${o.ratio ? ` · 1:${o.ratio}` : ""}</div></div>`;
      }).join("")}
      <div class="foot">${pts ? `Банк: ${num(d.total_points)} баллов · ` : ""}${d.active ? "делайте ставки баллами канала" : done ? "баллы выплачены победителям" : "ждём результата"}</div>`;
  }
  const tpl = document.createElement("div"); tpl.innerHTML = html;
  const oldRows = box.querySelectorAll(".row"), newRows = tpl.querySelectorAll(".row");
  if (key === shownKey && oldRows.length === newRows.length && oldRows.length) {
    // тот же опрос — обновляем на месте, чтобы полоски плавно росли
    box.querySelector(".head").innerHTML = tpl.querySelector(".head").innerHTML;
    box.querySelector("h1").innerHTML = tpl.querySelector("h1").innerHTML;
    box.querySelector(".foot").innerHTML = tpl.querySelector(".foot").innerHTML;
    newRows.forEach((n, i) => {
      const o = oldRows[i];
      o.className = n.className;
      o.querySelector(".bar i").style.width = n.querySelector(".bar i").style.width;
      o.querySelector(".bar .t").innerHTML = n.querySelector(".bar .t").innerHTML;
      const os = o.querySelector(".sub"), ns = n.querySelector(".sub");
      if (os && ns) os.innerHTML = ns.innerHTML;
    });
  } else {
    // новый опрос — полоски вырастают с нуля
    const widths = [...newRows].map(r => r.querySelector(".bar i").style.width);
    newRows.forEach(r => r.querySelector(".bar i").style.width = "0");
    box.replaceChildren(...tpl.childNodes);
    if (key !== shownKey) { shownKey = key; box.classList.remove("show"); void box.offsetWidth; }
    requestAnimationFrame(() => requestAnimationFrame(() =>
      box.querySelectorAll(".row .bar i").forEach((el, i) => el.style.width = widths[i])));
  }
  box.classList.add("show");
}

function demo() {
  const now = Date.now() / 1000, t = Math.floor(now / 6) % 2;
  return {
    overlay: {hide_sec: 20, show_points: true},
    poll: t ? null : {id: "p", title: "Во что играем дальше?", active: true, started: now - 30, ends: now + 75, total: 128,
      choices: [{title: "Продолжаем", votes: 61, pct: 48}, {title: "Другая игра", votes: 42, pct: 33}, {title: "Общение", votes: 25, pct: 19}]},
    prediction: t ? {id: "r", title: "Пройду босса с первой попытки?", active: true, locked: false, created: now - 20, locks: now + 100,
      status: "ACTIVE", total_points: 184500, outcomes: [
        {id: "a", title: "Да", users: 37, points: 112000, pct: 61, ratio: 1.65, color: "blue"},
        {id: "b", title: "Нет", users: 29, points: 72500, pct: 39, ratio: 2.54, color: "pink"}]} : null,
  };
}

let last = null;
async function tick() {
  if (PREVIEW) { render(demo()); return; }
  try {
    const r = await fetch("/api/votes", {cache: "no-store"});
    const j = await r.json();
    if (j.ok) { last = j.data; render(last); }
  } catch (e) { /* программа перезапускается — ждём */ }
}
tick();
setInterval(tick, 1500);
setInterval(() => { if (last && !PREVIEW) render(last); }, 500);   // плавный таймер между запросами
</script>
</body>
</html>
