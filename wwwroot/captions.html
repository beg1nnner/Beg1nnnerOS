<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js"></script>
<title>Beg1nnnerOS — субтитры</title>
<style>
  html, body { margin:0; background:transparent; font-family:"Segoe UI", Inter, system-ui, sans-serif; color:#fff; overflow:hidden; height:100vh; }
  body.preview { background:repeating-conic-gradient(#20202a 0 25%, #1a1a22 0 50%) 0 0/30px 30px; }
  #wrap { position:absolute; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 4vw; }
  #wrap.bottom { bottom:6vh; } #wrap.top { top:6vh; }
  .cap { max-width:76vw; text-align:center; transition:opacity .4s, transform .4s; }
  .cap.old { opacity:0; transform:translateY(6px); }
  .ru, .en { display:block; line-height:1.3; }
  .en { margin-top:3px; }
  .partial { opacity:.6; font-style:italic; }
  /* классика */
  .s-classic .cap { background:rgba(10,10,16,.78); border-radius:12px; padding:8px 20px; }
  .s-classic .ru { font-weight:700; } .s-classic .en { color:#c4b5fd; font-weight:600; font-size:.8em; }
  /* обводка */
  .s-outline .ru, .s-outline .en { font-weight:800; -webkit-text-stroke:.07em #000; paint-order:stroke fill; text-shadow:0 .08em 0 #000; }
  .s-outline .en { color:#fde047; font-size:.82em; }
  /* неон */
  .s-neon .cap { background:rgba(20,6,40,.82); border:2px solid #f0abfc; border-radius:14px; padding:8px 20px; box-shadow:0 0 24px #d946ef, inset 0 0 18px rgba(217,70,239,.35); }
  .s-neon .ru { font-weight:800; text-shadow:0 0 12px #f0abfc; } .s-neon .en { color:#67e8f9; font-weight:700; text-shadow:0 0 10px #22d3ee; font-size:.8em; }
  /* светлая */
  .s-light .cap { background:#fff; color:#111; border-radius:8px; padding:6px 18px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .s-light .ru { font-weight:700; } .s-light .en { color:#4c1d95; font-weight:600; font-size:.8em; }
</style>
</head>
<body>
<div id="wrap" class="bottom s-classic" data-noi18n></div>
<script>
// Источник для OBS: субтитры речи стримера. ?preview=1 — демо.
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.get("preview") === "1";
if (PREVIEW) document.body.classList.add("preview");
const wrap = document.getElementById("wrap");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastKey = "";

function render(s) {
  const c = s.cfg || {};
  wrap.className = (c.position === "top" ? "top" : "bottom") + " s-" + (c.style || "classic");
  wrap.style.fontSize = (Q.get("size") || c.font_size || 30) + "px";
  if (!s.enabled) { if (lastKey !== "off") { wrap.innerHTML = ""; lastKey = "off"; } return; }
  const now = s.now, show = c.show || "both";
  const lines = (s.lines || []).filter(l => now - l.ts < (c.hide_sec || 5) + 2).slice(-(c.max_lines || 2));
  let html = lines.map(l => {
    const old = now - l.ts > (c.hide_sec || 5);
    const ru = show !== "en" && l.text ? `<span class="ru">${esc(l.text)}</span>` : "";
    const en = show !== "orig" && l.en ? `<span class="en">${esc(l.en)}</span>` : "";
    return ru || en ? `<div class="cap ${old ? "old" : ""}">${ru}${en}</div>` : "";
  }).join("");
  if (s.partial && s.partial !== "…" && show !== "en") html += `<div class="cap"><span class="ru partial">${esc(s.partial)}</span></div>`;
  const key = html;
  if (key !== lastKey) { wrap.innerHTML = html; lastKey = key; }
}

function demo() {
  const t = Date.now() / 1000;
  return { enabled: true, now: t, partial: "", cfg: { style: Q.get("style") || "classic", font_size: 30, position: "bottom", max_lines: 2, hide_sec: 5, show: Q.get("show") || "both" },
    lines: [{ id: 1, ts: t - 1, text: "Так, ребята, сейчас попробуем пройти этого босса с первого раза", en: "Okay guys, now let's try to beat this boss on the first try" }] };
}

async function tick() {
  if (PREVIEW) { render(demo()); return; }
  try {
    const j = await (await fetch("/api/captions", { cache: "no-store" })).json();
    if (j.ok) render(j.data);
  } catch (e) { /* программа перезапускается */ }
}
tick();
setInterval(tick, 300);
</script>
</body>
</html>
