<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Beg1nnnerOS — музыка для OBS</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* В OBS страница невидима (только звук). В обычном браузере — подсказка для проверки. */
  #hint { display: none; font: 15px/1.5 system-ui, sans-serif; color: #e8e6f0; background: #17151f; padding: 18px 22px;
          margin: 20px; border-radius: 12px; max-width: 560px; border: 1px solid #2c2838; cursor: pointer; }
  #hint b { color: #c4b5fd; }
  body.browser #hint { display: block; }
</style>
</head>
<body>
<div id="hint">
  <b>Плеер музыки Beg1nnnerOS для OBS.</b><br>
  Добавьте эту страницу в OBS как источник «Браузер» и включите «Управлять аудио через OBS» —
  музыка появится отдельной дорожкой в микшере.<br><br>
  <span id="st">Нажмите сюда, чтобы проверить звук в браузере.</span>
</div>
<script>
const inObs = !!window.obsstudio;
if (!inObs) document.body.classList.add("browser");
// Два «дека», как у диджея: новый трек нарастает, старый затухает (плавный переход).
// Громкость с выравниванием может быть больше 1, поэтому идём через WebAudio:
// усиление → лимитер (компрессор с жёстким порогом −1 дБ) → выход.
let ctx = null, lim = null, deck = null, gen = 0, ended = 0, err = "", busy = false, wantGain = 1;
function graph() {
  if (ctx) return;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    lim = ctx.createDynamicsCompressor();
    lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20;
    lim.attack.value = 0.002; lim.release.value = 0.2;
    lim.connect(ctx.destination);
  } catch (e) { ctx = null; }
}
function newDeck(myGen) {
  const a = new Audio(); a.preload = "auto";
  const d = { a, gen: myGen, gain: null };
  if (ctx) {
    try { const src = ctx.createMediaElementSource(a); d.gain = ctx.createGain(); src.connect(d.gain).connect(lim); } catch (e) { d.gain = null; }
  }
  a.addEventListener("ended", () => { if (deck === d) { ended = gen; tick(); } });
  a.addEventListener("error", () => {
    if (deck !== d || !a.getAttribute("src")) return;
    const codes = { 1: "загрузка прервана", 2: "ошибка сети", 3: "ошибка декодирования", 4: "формат не поддерживается" };
    err = "файл не открылся (" + (codes[a.error && a.error.code] || "неизвестная ошибка") + ")";
    tick();
  });
  return d;
}
function setGain(d, g, sec) {
  if (!d) return;
  if (d.gain && ctx) {
    const t = ctx.currentTime;
    d.gain.gain.cancelScheduledValues(t);
    d.gain.gain.setValueAtTime(d.gain.gain.value, t);
    if (sec > 0.05) d.gain.gain.linearRampToValueAtTime(g, t + sec); else d.gain.gain.setTargetAtTime(g, t, 0.05);
  } else d.a.volume = Math.max(0, Math.min(1, g));
}
function retire(d, sec) {
  if (!d) return;
  setGain(d, 0, sec);
  setTimeout(() => { try { d.a.pause(); d.a.removeAttribute("src"); d.a.load(); } catch (e) {} }, Math.max(80, sec * 1000 + 150));
}
async function tick() {
  if (busy) return;
  busy = true;
  try {
    const a = deck && deck.a;
    const q = new URLSearchParams({ gen, pos: ((a && a.currentTime) || 0).toFixed(2), ended, err });
    err = "";
    const r = await fetch("/api/music/obs?" + q, { cache: "no-store" });
    const s = (await r.json()).data;
    graph();
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    if (s.gen !== gen) {
      gen = s.gen; ended = 0; err = "";   // ошибки прошлого трека больше не актуальны
      const fade = s.fade || 0, old = deck;
      if (s.src) {
        deck = newDeck(gen);
        if (fade > 0.05) setGain(deck, 0, 0);
        deck.a.src = s.src + (s.start > 0.5 ? "#t=" + s.start.toFixed(1) : "");
        if (fade > 0.05) setGain(deck, s.gain, fade); else setGain(deck, s.gain, 0);
      } else deck = null;
      retire(old, old && old.a && !old.a.paused ? (fade > 0.05 ? fade : 0.15) : 0);
    } else if (deck) setGain(deck, s.gain, 0);
    wantGain = s.gain;
    const d = deck;
    if (d && s.src) {
      if (s.paused && !d.a.paused) d.a.pause();
      if (!s.paused && d.a.paused && ended !== gen) {
        const g = gen;
        d.a.play().catch(e => {
          if (g !== gen || !d.a.getAttribute("src") || e.name === "AbortError") return;   // трек уже сменился
          if (inObs) err = "не запускается воспроизведение: " + e.message; else setSt("Нажмите сюда, чтобы разрешить звук.");
        });
      }
    }
    setSt(s.src ? (d && d.a.paused ? "Пауза." : "Играет ✓") : "Подключено к программе ✓ Ждёт трек.");
  } catch (e) {
    setSt("Нет связи с программой — она запущена?");
  } finally { busy = false; }
}
function setSt(t) { const el = document.getElementById("st"); if (el && !inObs) el.textContent = t; }
document.getElementById("hint").addEventListener("click", () => { graph(); if (ctx) ctx.resume(); tick(); });
setInterval(tick, 500);
tick();
</script>
</body>
</html>
