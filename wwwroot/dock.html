<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js"></script>
<link rel="icon" href="/static/favicon.png">
<title>Beg1nnnerOS — док</title>
<link rel="stylesheet" href="/static/style.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("hub-theme") || "studio"; } catch (e) {}</script>
<style>
  body { padding:var(--sp-3); }
  .card { padding:var(--sp-4); margin-bottom:var(--sp-3); border-radius:var(--r-lg); }
  .micro { font:500 var(--fs-xs) var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .num { font-family:var(--mono); }
  #dock-note { position:fixed; left:12px; right:12px; bottom:12px; z-index:140; display:flex; gap:var(--sp-2); align-items:center; padding:var(--sp-2) var(--sp-3); border-radius:var(--r-md); background:var(--panel); border:1px solid var(--line); box-shadow:var(--pop-shadow); font-size:var(--fs-sm); opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity var(--t) var(--ease), transform var(--t) var(--ease); }
  #dock-note.show { opacity:1; transform:none; pointer-events:auto; }
  #dock-note svg { flex:none; color:var(--ok); } #dock-note.err svg { color:var(--err); }
  .modal.dlg { padding:var(--sp-5); } .dlg .dlg-acts { margin-top:var(--sp-4); }
  button .ic, .ic-tx .ic { flex:none; } button:has(> .ic) { display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2); }
  .dnp-top { display:flex; gap:var(--sp-3); align-items:center; }
  .dnp-cv { position:relative; width:60px; height:60px; border-radius:var(--r-md); flex:none; background:color-mix(in srgb, var(--accent) 14%, var(--bg)); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); display:flex; align-items:center; justify-content:center; }
  .dnp-cv { overflow:hidden; } .dnp-cv img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dnp-cv i { width:14px; height:14px; border-radius:var(--r-full); background:var(--accent); box-shadow:0 0 14px color-mix(in srgb, var(--accent) 80%, transparent); }
  .dnp-meta { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .dnp-meta .micro { color:var(--accent2); }
  .dbar { height:4px; border-radius:var(--r-sm); background:color-mix(in srgb, var(--fg) 9%, transparent); margin:var(--sp-4) 0 var(--sp-2); }
  .dbar i { display:block; height:100%; width:0; border-radius:var(--r-sm); background:var(--accent); transition:width .9s linear; }
  .dtimes { display:flex; justify-content:space-between; font:var(--fs-xs) var(--mono); color:var(--dim); }
  .dctl { display:flex; align-items:center; justify-content:center; gap:var(--sp-3); margin:var(--sp-3) 0 var(--sp-2); }
  .rnd { width:44px; height:44px; padding:0; border-radius:var(--r-full); display:flex; align-items:center; justify-content:center; }
  .rnd.big { width:52px; height:52px; background:var(--fg); color:var(--bg); border:none; }
  .rnd.like { color:var(--love); border-color:color-mix(in srgb, var(--love) 35%, transparent); background:color-mix(in srgb, var(--love) 8%, transparent); }
  #like.on .ic { fill:currentColor; }
  .dvol { display:flex; align-items:center; gap:var(--sp-3); color:var(--dim); font-size:var(--fs-sm); }
  .dvol .num { color:var(--fg); width:22px; }
  .dq-h { display:flex; justify-content:space-between; align-items:center; margin:var(--sp-3) 0 var(--sp-1); }
  .dq { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) 0; border-top:1px solid var(--hair); }
  .dq .n { font:var(--fs-xs) var(--mono); color:var(--dim); flex:none; }
  .dq .tt { flex:1; min-width:0; display:flex; flex-direction:column; }
  .dq .tt b { font-size:var(--fs-md); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dq .tt small { font-size:var(--fs-xs); color:var(--dim); } body.dense { --fs:12px; padding:var(--sp-1); } body.dense .card { padding:var(--sp-2); margin-bottom:var(--sp-2); }
  body.dense button { padding:var(--sp-1) var(--sp-2); }
  .now-title { font-weight:700; font-size:1.05em; }
  .q li { margin:var(--sp-1) 0; }
  .q { padding-left:1.2em; margin:var(--sp-2) 0 0; }
  .h { display:flex; gap:var(--sp-2); padding:var(--sp-1) 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .h:last-child { border-bottom:0; }
  .h .t { flex:none; width:42px; font-size:.85em; opacity:.6; }
  .h .n { flex:1; min-width:0; } .h .w { font-size:.82em; opacity:.65; }
  .h button { flex:none; padding:var(--sp-half) var(--sp-2); }
  #like.on { color:var(--love); border-color:var(--love); background:color-mix(in srgb, var(--love) 18%, transparent); }
  #cc.on { color:var(--accent2); border-color:color-mix(in srgb, var(--accent) 60%, transparent); background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .vtpl { display:flex; flex-wrap:wrap; gap:var(--sp-1); margin:var(--sp-2) 0; }
  .vtpl button { padding:var(--sp-1) var(--sp-2); font-size:.9em; }
  .vr { margin:var(--sp-2) 0; border-radius:var(--r-sm); }
  .vr .tt { display:flex; justify-content:space-between; gap:var(--sp-2); font-size:.95em; }
  .vr .bb { height:7px; background:color-mix(in srgb, var(--fg) 8%, transparent); border-radius:var(--r-sm); overflow:hidden; margin-top:3px; }
  .vr .bb i { display:block; height:100%; background:var(--accent); transition:width .5s; }
  .vr.pick { cursor:pointer; padding:3px var(--sp-1); margin:var(--sp-1) calc(-1 * var(--sp-1)); } .vr.pick:hover { background:var(--hover); }
  .vr.sel { outline:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 18%, transparent); } .vr.win .tt span { color:var(--warn); font-weight:600; }
</style>
</head>
<body>
<div class="row" style="justify-content:space-between">
  <div class="tabs" style="margin-bottom:8px;border:none">
    <button data-t="music" class="on">Музыка</button><button data-t="hist">История</button><button data-t="media">Медиа</button><button data-t="votes">Опросы</button>
  </div>
  <button class="sm" id="dense">Плотно</button>
</div>

<div id="t-music">
  <div class="card dnp">
    <div class="dnp-top"><div class="dnp-cv" aria-hidden="true"><i></i><img id="dnp-art" alt="" referrerpolicy="no-referrer" hidden onerror="this.hidden=true;ART_BAD.add(this.dataset.src)"></div>
      <div class="dnp-meta"><span class="micro">Сейчас играет</span><div class="now-title" id="now" data-noi18n>—</div><div class="muted small" id="who"></div></div></div>
    <div class="dbar"><i id="dbar"></i></div>
    <div class="dtimes"><span id="dpos"></span><span id="dvotes"></span><span id="ddur"></span></div>
    <div class="small" id="likemsg" style="color:#f472b6;min-height:0"></div>
    <div class="dctl">
      <button id="like" class="rnd like" title="Понравился — добавить в резервный плейлист" aria-label="Лайк"><svg class="ic" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.3l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
      <button id="pause" class="rnd big" title="Пауза / продолжить" aria-label="Пауза"><svg class="ic" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14"/></svg></button>
      <button id="skip" class="rnd" title="Пропустить трек" aria-label="Пропустить"><svg class="ic" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
      <button id="wheel" class="rnd" title="Крутить колесо фортуны" aria-label="Колесо фортуны"><svg class="ic" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg></button>
      <button id="cc" class="rnd cc" title="Субтитры речи в OBS" aria-label="Субтитры"><svg class="ic" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg></button>
    </div>
    <label class="dvol" title="Громкость музыки"><svg class="ic" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" min="0" max="100" id="vol" class="grow" aria-label="Громкость музыки"><span id="volv" class="num"></span></label>
  </div>
  <div class="card">
    <div class="row"><input id="q" class="grow" placeholder="Ссылка или «исполнитель — название»"><button id="add" class="primary">+</button></div>
    <div class="dq-h"><span class="micro">Очередь</span><span class="num muted small" id="qn"></span></div>
    <div id="queue"></div>
  </div>
</div>

<div id="t-hist" class="hidden">
  <div class="card">
    <div class="row"><select id="hscope" class="grow"><option value="stream">Этот стрим</option><option value="today">Сегодня</option><option value="week">7 дней</option></select>
      <button class="sm" id="hcopy" title="Скопировать список" aria-label="Скопировать список"></button></div>
    <div id="hlist" style="margin-top:8px"></div>
  </div>
</div>

<div id="t-media" class="hidden">
  <div class="card">
    <div class="row"><span class="grow">Общая громкость алертов</span><span id="mv" class="small muted"></span></div>
    <input type="range" min="0" max="100" id="master">
    <div class="small muted" id="apend" style="margin-top:6px"></div>
    <button class="danger" id="stop" style="margin-top:8px"></button>
  </div>
  <div class="card" id="alist"></div>
</div>
<div id="t-votes" class="hidden">
  <div id="vwarn"></div>
  <div class="card" id="vlive-poll"></div>
  <div class="card" id="vlive-pred"></div>
  <div class="card" id="vstart">
    <div class="muted small">Быстрый запуск — опрос:</div><div class="vtpl" id="vtp"></div>
    <div class="muted small">прогноз:</div><div class="vtpl" id="vtr"></div>
    <details style="margin-top:6px"><summary class="small">Свой вопрос</summary>
      <div class="row" style="margin-top:6px"><select id="vkind"><option value="poll">Опрос</option><option value="pred">Прогноз</option></select>
        <select id="vdur"><option value="60">1 мин</option><option value="120" selected>2 мин</option><option value="300">5 мин</option><option value="600">10 мин</option></select></div>
      <input id="vq" placeholder="Вопрос" style="width:100%;margin-top:6px" maxlength="60">
      <input id="vo" placeholder="Варианты через / : Да / Нет" style="width:100%;margin-top:6px">
      <button class="primary" id="vgo" style="margin-top:6px">▶ Запустить</button>
    </details>
  </div>
</div>
<script>
// ---- иконки и диалоги док-панели (без системных alert/confirm: в OBS они выглядят чужеродно) ----
const svgIc = (d, size = 14) => `<svg class="ic" aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const DI = {
  check: svgIc('<path d="M20 6L9 17l-5-5"/>'), x: svgIc('<path d="M18 6L6 18M6 6l12 12"/>'),
  copy: svgIc('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>'),
  stop: svgIc('<rect x="6" y="6" width="12" height="12" rx="2"/>'), lock: svgIc('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'),
  trophy: svgIc('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4"/>'),
  alert: svgIc('<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  poll: svgIc('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', 12), pred: svgIc('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>', 12),
};
const ART_BAD = new Set();   // обложки, которые не загрузились
const tr2 = s => (window.tr ? window.tr(s) : s);
/** Короткое сообщение внизу док-панели (вместо alert). */
function dockNote(text, err) {
  let n = document.getElementById("dock-note");
  if (!n) { n = document.createElement("div"); n.id = "dock-note"; n.setAttribute("role", "status"); document.body.appendChild(n); }
  n.className = err ? "err" : ""; n.innerHTML = (err ? DI.alert : DI.check) + "<span></span>"; n.lastChild.textContent = tr2(text || "");
  n.classList.add("show"); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove("show"), err ? 5000 : 2500);
}
/** Подтверждение (вместо confirm): Esc/фон — отмена, Enter — да. */
function dockAsk(text, okLabel, danger) {
  return new Promise(res => {
    const back = document.activeElement;
    const bg = document.createElement("div"); bg.className = "modal-bg dlg-bg";
    bg.innerHTML = `<div class="modal dlg" role="dialog" aria-modal="true"><h3></h3><div class="dlg-acts"><button type="button" data-c></button><button type="button" class="${danger ? "danger solid" : "primary"}" data-o></button></div></div>`;
    bg.querySelector("h3").textContent = tr2(text); bg.querySelector("[data-c]").textContent = tr2("Отмена"); bg.querySelector("[data-o]").textContent = tr2(okLabel || "Да");
    document.body.appendChild(bg);
    const done = v => { document.removeEventListener("keydown", key, true); bg.remove(); if (back) back.focus(); res(v); };
    const key = e => { if (e.key === "Escape") done(false); else if (e.key === "Enter") { e.preventDefault(); done(document.activeElement !== bg.querySelector("[data-c]")); } else if (e.key === "Tab") { e.preventDefault(); const b = [...bg.querySelectorAll("button")]; b[(b.indexOf(document.activeElement) + 1) % 2].focus(); } };
    document.addEventListener("keydown", key, true);
    bg.onmousedown = e => { if (e.target === bg) done(false); };
    bg.querySelector("[data-c]").onclick = () => done(false); bg.querySelector("[data-o]").onclick = () => done(true);
    (danger ? bg.querySelector("[data-c]") : bg.querySelector("[data-o]")).focus();
  });
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post = (u, b) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b||{})}).then(r => r.json());
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("t-music").classList.toggle("hidden", b.dataset.t !== "music");
  $("t-hist").classList.toggle("hidden", b.dataset.t !== "hist");
  $("t-media").classList.toggle("hidden", b.dataset.t !== "media");
  $("t-votes").classList.toggle("hidden", b.dataset.t !== "votes");
  if (b.dataset.t === "hist") hist();
  if (b.dataset.t === "votes") votes();
});
try { if (localStorage.getItem("dock-dense") === "1") document.body.classList.add("dense"); } catch (e) {}
$("dense").onclick = () => { const on = document.body.classList.toggle("dense");
  try { localStorage.setItem("dock-dense", on ? "1" : "0"); } catch (e) {} };
$("pause").onclick = () => post("/api/music/pause");
$("skip").onclick = () => post("/api/music/skip");
$("wheel").onclick = async () => {
  const j = await post("/api/wheel/spin", {source: "dock"}).catch(() => null);
  const m = $("likemsg"); m.textContent = j && j.ok ? tr2("Колесо запущено") : (j && (j.error || j.message)) || tr2("Не получилось запустить колесо");
  clearTimeout(m._t); m._t = setTimeout(() => m.textContent = "", 3000);
};
$("cc").onclick = async () => {
  const r = await post("/api/captions/toggle");
  if (r.ok) { $("cc").classList.toggle("on", r.data.enabled); return; }
  // модели нет — ничего не скачиваем, подсказываем, где её взять
  const m = $("likemsg"); m.textContent = tr2("Сначала скачайте модель распознавания — в панели, раздел «Субтитры»");
  clearTimeout(m._t); m._t = setTimeout(() => m.textContent = "", 5000);
};
setInterval(async () => { try { const j = await (await fetch("/api/captions", {cache: "no-store"})).json(); if (j.ok) $("cc").classList.toggle("on", !!j.data.enabled); } catch (e) {} }, 3000);
let likeT = null;
$("like").onclick = async () => {
  const r = await post("/api/music/like");
  $("likemsg").textContent = r.ok ? (r.data.liked ? tr2("В резервном плейлисте") : tr2("Убран из резервного плейлиста")) : r.error;
  clearTimeout(likeT); likeT = setTimeout(() => $("likemsg").textContent = "", 3000);
  tick();
};
let volBusy = 0, masterBusy = 0;
$("vol").oninput = e => { volBusy = Date.now(); $("volv").textContent = e.target.value; post("/api/music/volume", {volume:+e.target.value}); };
$("master").oninput = e => { masterBusy = Date.now(); $("mv").textContent = e.target.value; post("/api/alerts/volume", {volume:+e.target.value}); };
$("add").onclick = async () => { const q = $("q").value.trim(); if (!q) return; $("add").disabled = true;
  const r = await post("/api/music/add", {query:q}); $("add").disabled = false;
  if (r.ok) $("q").value = ""; else dockNote(r.error, true); };
$("q").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
$("stop").onclick = () => post("/api/alerts/stop");
let WS_OK = false, WS_RETRY = 1000;
function wsState() {
  let ws;
  try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/state"); } catch (e) { return; }
  ws.onopen = () => { WS_OK = true; WS_RETRY = 1000; };
  ws.onmessage = e => { try { const j = JSON.parse(e.data); if (j.ok) tick(j.data); } catch (x) {} };
  ws.onclose = () => { WS_OK = false; setTimeout(wsState, WS_RETRY); WS_RETRY = Math.min(15000, WS_RETRY * 2); };
  ws.onerror = () => { try { ws.close(); } catch (x) {} };
}
async function tick(pushed) {
  try {
    const s = pushed || (await (await fetch("/api/state", {cache:"no-store"})).json()).data;
    if (document.documentElement.dataset.theme !== s.ui_theme) document.documentElement.dataset.theme = s.ui_theme;
    const m = s.music, c = m.current;
    $("now").textContent = c ? c.title : "—";
    const art = c && c.cover && !ART_BAD.has(c.cover) ? c.cover : "";
    if ($("dnp-art").dataset.src !== art) { $("dnp-art").dataset.src = art; if (art) $("dnp-art").src = art; }
    $("dnp-art").hidden = !art;
    $("like").classList.toggle("on", !!(c && c.liked)); $("like").disabled = !c;
    const fm = x => { x = Math.max(0, Math.round(x || 0)); return Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0"); };
    $("dbar").style.width = c && c.duration ? Math.min(100, c.position / c.duration * 100) + "%" : "0";
    $("dpos").textContent = c ? fm(c.position) : ""; $("ddur").textContent = c && c.duration ? fm(c.duration) : "";
    $("dvotes").textContent = c && m.votes ? `skip ${m.votes}/${m.votes_needed}` : "";
    $("qn").textContent = m.queue.length ? m.queue.length + " · " + fm(m.queue.reduce((a, t) => a + (t.duration || 0), 0)) : "";
    $("who").textContent = c ? (c.requester ? "Заказ: " + c.requester : "") + (c.paused ? " · пауза" : "") : "";
    if (Date.now() - volBusy > 1500) { $("vol").value = m.volume; $("volv").textContent = m.volume; }
    if (Date.now() - masterBusy > 1500) { $("master").value = s.alerts.volume; $("mv").textContent = s.alerts.volume; }
    $("queue").innerHTML = m.queue.map((t, i) => `<div class="dq"><span class="n">${i + 1}</span><span class="tt"><b data-noi18n>${esc(t.title)}</b><small data-noi18n>${esc(t.requester)}</small></span><span class="n">${fm(t.duration)}</span></div>`).join("") || '<span class="muted small">Очередь пуста</span>';
    $("apend").textContent = `В очереди алертов: ${s.alerts.pending}` + (s.alerts.current ? ` · показ: ${s.alerts.current.name}` : "") +
      (s.ready.alerts_source ? "" : " · источник /alerts не подключён");
  } catch (e) {}
}
async function alerts() {
  try {
    const {data} = await (await fetch("/api/alerts")).json();
    $("alist").innerHTML = data.items.map(a => `<div class="list-item"><span class="grow ellipsis">${esc(a.name)}</span>
      <input type="range" min="0" max="100" value="${a.volume}" data-id="${a.id}" style="width:110px"></div>`).join("") || '<span class="muted small">Алертов нет</span>';
    $("alist").querySelectorAll("input").forEach(i => i.oninput = () => post("/api/alerts/volume", {id:i.dataset.id, volume:+i.value}));
  } catch (e) {}
}
// История треков: последние 40, обновляется раз в 10 секунд, пока вкладка открыта
let HITEMS = [];
async function hist() {
  if ($("t-hist").classList.contains("hidden")) return;
  try {
    const {data} = await (await fetch("/api/music/history?limit=40&fallback=0&scope=" + $("hscope").value, {cache: "no-store"})).json();
    HITEMS = data.items;
    $("hlist").innerHTML = HITEMS.map(t => { const d = new Date(t.ts * 1000);
      return `<div class="h"><span class="t">${d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})}</span>
        <span class="n">${esc(t.title)}${t.requester ? `<div class="w">${esc(t.requester)}</div>` : ""}</span>
        <button class="sm" title="В очередь заново" data-i="${HITEMS.indexOf(t)}">＋</button></div>`; }).join("")
      || '<span class="muted small">Треков пока нет</span>';
    $("hlist").querySelectorAll("button[data-i]").forEach(b => b.onclick = async () => {
      const t = HITEMS[+b.dataset.i]; if (!t) return;
      b.disabled = true; b.textContent = "…";
      const r = await post("/api/music/add", {query: t.url || t.title});
      b.innerHTML = r.ok ? DI.check : DI.x; if (!r.ok) { b.disabled = false; dockNote(r.error, true); }
    });
  } catch (e) {}
}
$("hscope").onchange = hist;
$("hcopy").onclick = async () => {
  const text = HITEMS.slice().reverse().map(t => `${t.title}${t.requester ? " (" + t.requester + ")" : ""}${t.url ? " " + t.url : ""}`).join("\n");
  try { await navigator.clipboard.writeText(text); $("hcopy").innerHTML = DI.check; dockNote("Список скопирован"); } catch (e) { $("hcopy").innerHTML = DI.x; dockNote("Не получилось скопировать", true); }
  setTimeout(() => $("hcopy").innerHTML = DI.copy, 1500);
};
// Опросы и прогнозы: быстрый запуск по шаблону, живые результаты, управление
let V = null, VPICK = "", VBUSY = false;
const vnum = n => Math.round(n).toLocaleString("ru-RU");
const vleft = t => { const s = Math.max(0, Math.round(t - Date.now() / 1000)); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : s + " с"; };
async function vdo(url, body, ask) {
  if (VBUSY) return;
  if (ask && !await dockAsk(ask.text || ask, ask.ok, ask.danger)) return;
  VBUSY = true;
  try { const r = await post("/api/votes/" + url, body); if (!r.ok) dockNote(r.error, true); else VPICK = ""; } finally { VBUSY = false; votes(); }
}
async function votes() {
  if ($("t-votes").classList.contains("hidden")) return;
  try { const j = await (await fetch("/api/votes", {cache: "no-store"})).json(); if (!j.ok) return; V = j.data; } catch (e) { return; }
  const w = [];
  if (!V.ready) w.push("Войдите в Twitch в программе");
  else if (!V.scopes.polls || !V.scopes.predictions) w.push("Нужны новые права: в программе нажмите «Войти в Twitch заново»");
  [V.poll_error, V.prediction_error].filter(Boolean).forEach(e => w.push(esc(e)));
  $("vwarn").innerHTML = w.map(x => `<div class="notice warn">${DI.alert}<div>${x}</div></div>`).join("");
  $("vtp").innerHTML = V.templates.polls.map((t, i) => `<button data-k="poll" data-i="${i}" title="${esc(t.choices.join(" / "))}">${esc(t.title)}</button>`).join("") || '<span class="muted small">нет шаблонов</span>';
  $("vtr").innerHTML = V.templates.predictions.map((t, i) => `<button data-k="pred" data-i="${i}" title="${esc(t.outcomes.join(" / "))}">${esc(t.title)}</button>`).join("") || '<span class="muted small">нет шаблонов</span>';
  document.querySelectorAll(".vtpl button[data-k]").forEach(b => b.onclick = () => {
    const t = (b.dataset.k === "poll" ? V.templates.polls : V.templates.predictions)[+b.dataset.i];
    if (b.dataset.k === "poll") vdo("poll/start", {title: t.title, choices: t.choices, duration: t.duration}, {text: `Запустить опрос «${t.title}»?`, ok: "Запустить"});
    else vdo("prediction/start", {title: t.title, outcomes: t.outcomes, window: t.window}, {text: `Запустить прогноз «${t.title}»?`, ok: "Запустить"});
  });
  const p = V.poll;
  if (!p) $("vlive-poll").classList.add("hidden");
  else {
    const max = Math.max(...p.choices.map(c => c.votes));
    $("vlive-poll").classList.remove("hidden");
    $("vlive-poll").innerHTML = `<div class="muted small ic-tx">${DI.poll}Опрос · ${p.active ? "осталось " + vleft(p.ends) : "завершён"} · ${p.total} гол.</div><b>${esc(p.title)}</b>
      ${p.choices.map(c => `<div class="vr ${!p.active && max > 0 && c.votes === max ? "win" : ""}"><div class="tt"><span>${esc(c.title)}</span><span>${c.pct}% · ${c.votes}</span></div><div class="bb"><i style="width:${c.pct}%"></i></div></div>`).join("")}
      ${p.active ? `<button class="danger sm" id="vpend">${DI.stop}<span>Завершить</span></button>` : ""}`;
    if ($("vpend")) $("vpend").onclick = () => vdo("poll/end", {}, {text: "Завершить опрос досрочно?", ok: "Завершить", danger: true});
  }
  const r = V.prediction, live = r && (r.active || r.locked);
  if (!r) $("vlive-pred").classList.add("hidden");
  else {
    $("vlive-pred").classList.remove("hidden");
    $("vlive-pred").innerHTML = `<div class="muted small ic-tx">${DI.pred}Прогноз · ${r.active ? "ставки " + vleft(r.locks) : r.locked ? "ставки закрыты" : r.status === "CANCELED" ? "отменён" : "завершён"} · ${vnum(r.total_points)} баллов</div><b>${esc(r.title)}</b>
      ${r.outcomes.map(o => `<div class="vr ${live ? "pick" : ""} ${o.id === VPICK ? "sel" : ""} ${r.winner === o.id ? "win" : ""}" data-o="${o.id}"><div class="tt"><span>${r.winner === o.id ? DI.trophy + " " : ""}${esc(o.title)}</span><span>${o.pct}% · ${o.users} чел.</span></div><div class="bb"><i style="width:${o.pct}%"></i></div></div>`).join("")}
      ${live ? `<div class="row" style="margin-top:6px;flex-wrap:wrap">${r.active ? `<button class="sm" id="vlock">${DI.lock}<span>Закрыть ставки</span></button>` : ""}
        <button class="sm primary" id="vwin">${DI.trophy}<span>Победитель</span></button><button class="sm danger" id="vcancel">Отмена</button></div>
        <div class="muted small" style="margin-top:4px">Нажмите на исход, затем «Победитель»</div>` : ""}`;
    $("vlive-pred").querySelectorAll(".vr.pick").forEach(el => el.onclick = () => { VPICK = el.dataset.o; votes(); });
    if ($("vlock")) $("vlock").onclick = () => vdo("prediction/lock");
    if ($("vcancel")) $("vcancel").onclick = () => vdo("prediction/cancel", {}, {text: "Отменить прогноз и вернуть баллы?", ok: "Отменить прогноз", danger: true});
    if ($("vwin")) $("vwin").onclick = () => {
      const o = r.outcomes.find(x => x.id === VPICK); if (!o) return dockNote("Сначала нажмите на исход-победитель", true);
      vdo("prediction/resolve", {outcome_id: o.id}, {text: `Победил «${o.title}»? Баллы будут выплачены.`, ok: "Выплатить"});
    };
  }
  $("vstart").classList.toggle("hidden", !!((p && p.active) && live));
}
$("vgo").onclick = () => {
  const opts = $("vo").value.split("/").map(x => x.trim()).filter(Boolean), title = $("vq").value.trim(), d = +$("vdur").value;
  if ($("vkind").value === "poll") vdo("poll/start", {title, choices: opts, duration: d});
  else vdo("prediction/start", {title, outcomes: opts, window: d});
};
$("hcopy").innerHTML = DI.copy; $("stop").innerHTML = DI.stop + "<span>" + tr2("Остановить все МедиаАлерты") + "</span>";
tick(); wsState(); alerts(); setInterval(() => { if (!WS_OK) tick(); }, 1500); setInterval(alerts, 30000); setInterval(hist, 10000); setInterval(votes, 2000);
</script>
</body>
</html>
