<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js"></script>
<link rel="icon" href="/static/favicon.png">
<title>Beg1nnnerOS — док</title>
<link rel="stylesheet" href="/static/style.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("hub-theme") || "twitch"; } catch (e) {}</script>
<style>
  body { padding:10px; } body.dense { --fs:12px; padding:4px; } body.dense .card { padding:8px; margin-bottom:8px; }
  body.dense button { padding:4px 8px; }
  .now-title { font-weight:700; font-size:1.05em; }
  .q li { margin:4px 0; }
  .q { padding-left:1.2em; margin:6px 0 0; }
  .h { display:flex; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .h:last-child { border-bottom:0; }
  .h .t { flex:none; width:42px; font-size:.85em; opacity:.6; }
  .h .n { flex:1; min-width:0; } .h .w { font-size:.82em; opacity:.65; }
  .h button { flex:none; padding:2px 9px; }
  #like.on { color:#f472b6; border-color:#f472b680; }
  .vtpl { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
  .vtpl button { padding:4px 9px; font-size:.9em; }
  .vr { margin:7px 0; border-radius:6px; }
  .vr .tt { display:flex; justify-content:space-between; gap:8px; font-size:.95em; }
  .vr .bb { height:7px; background:#00000040; border-radius:4px; overflow:hidden; margin-top:3px; }
  .vr .bb i { display:block; height:100%; background:var(--accent); transition:width .5s; }
  .vr.pick { cursor:pointer; padding:3px 5px; margin:4px -5px; } .vr.pick:hover { background:#ffffff10; }
  .vr.sel { outline:1px solid var(--accent); background:#9146ff30; } .vr.win .tt span { color:#facc15; font-weight:600; }
</style>
</head>
<body>
<div class="row" style="justify-content:space-between">
  <div class="tabs" style="margin-bottom:8px;border:none">
    <button data-t="music" class="on">Музыка</button><button data-t="hist">История</button><button data-t="media">Медиа</button><button data-t="votes">Опросы</button>
  </div>
  <button class="sm" id="dense">Плотно</button>
</div>

<div id="t-music">
  <div class="card">
    <div class="muted small">Сейчас играет</div>
    <div class="now-title" id="now" data-noi18n>—</div>
    <div class="muted small" id="who"></div>
    <div class="small" id="likemsg" style="color:#f472b6;min-height:0"></div>
    <div class="row" style="margin-top:8px">
      <button id="pause">⏯ Пауза</button><button id="skip">⏭ Пропуск</button><button id="like" title="Понравился — добавить в резервный плейлист">♡</button>
      <input type="range" min="0" max="100" id="vol" class="grow" title="Громкость музыки">
      <span id="volv" class="small muted"></span>
    </div>
  </div>
  <div class="card">
    <div class="row"><input id="q" class="grow" placeholder="Ссылка или «исполнитель — название»"><button id="add" class="primary">+</button></div>
    <ol class="q" id="queue"></ol>
  </div>
</div>

<div id="t-hist" class="hidden">
  <div class="card">
    <div class="row"><select id="hscope" class="grow"><option value="stream">Этот стрим</option><option value="today">Сегодня</option><option value="week">7 дней</option></select>
      <button class="sm" id="hcopy" title="Скопировать список">📋</button></div>
    <div id="hlist" style="margin-top:8px"></div>
  </div>
</div>

<div id="t-media" class="hidden">
  <div class="card">
    <div class="row"><span class="grow">Общая громкость алертов</span><span id="mv" class="small muted"></span></div>
    <input type="range" min="0" max="100" id="master">
    <div class="small muted" id="apend" style="margin-top:6px"></div>
    <button class="danger" id="stop" style="margin-top:8px">⏹ Остановить все МедиаАлерты</button>
  </div>
  <div class="card" id="alist"></div>
</div>
<div id="t-votes" class="hidden">
  <div id="vwarn"></div>
  <div class="card" id="vlive-poll"></div>
  <div class="card" id="vlive-pred"></div>
  <div class="card" id="vstart">
    <div class="muted small">Быстрый запуск — опрос:</div><div class="vtpl" id="vtp"></div>
    <div class="muted small">прогноз:</div><div class="vtpl" id="vtr"></div>
    <details style="margin-top:6px"><summary class="small">Свой вопрос</summary>
      <div class="row" style="margin-top:6px"><select id="vkind"><option value="poll">Опрос</option><option value="pred">Прогноз</option></select>
        <select id="vdur"><option value="60">1 мин</option><option value="120" selected>2 мин</option><option value="300">5 мин</option><option value="600">10 мин</option></select></div>
      <input id="vq" placeholder="Вопрос" style="width:100%;margin-top:6px" maxlength="60">
      <input id="vo" placeholder="Варианты через / : Да / Нет" style="width:100%;margin-top:6px">
      <button class="primary" id="vgo" style="margin-top:6px">▶ Запустить</button>
    </details>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post = (u, b) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b||{})}).then(r => r.json());
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("t-music").classList.toggle("hidden", b.dataset.t !== "music");
  $("t-hist").classList.toggle("hidden", b.dataset.t !== "hist");
  $("t-media").classList.toggle("hidden", b.dataset.t !== "media");
  $("t-votes").classList.toggle("hidden", b.dataset.t !== "votes");
  if (b.dataset.t === "hist") hist();
  if (b.dataset.t === "votes") votes();
});
try { if (localStorage.getItem("dock-dense") === "1") document.body.classList.add("dense"); } catch (e) {}
$("dense").onclick = () => { const on = document.body.classList.toggle("dense");
  try { localStorage.setItem("dock-dense", on ? "1" : "0"); } catch (e) {} };
$("pause").onclick = () => post("/api/music/pause");
$("skip").onclick = () => post("/api/music/skip");
let likeT = null;
$("like").onclick = async () => {
  const r = await post("/api/music/like");
  $("likemsg").textContent = r.ok ? (r.data.liked ? "♥ В резервном плейлисте" : "♡ Убран из резервного плейлиста") : r.error;
  clearTimeout(likeT); likeT = setTimeout(() => $("likemsg").textContent = "", 3000);
  tick();
};
let volBusy = 0, masterBusy = 0;
$("vol").oninput = e => { volBusy = Date.now(); $("volv").textContent = e.target.value; post("/api/music/volume", {volume:+e.target.value}); };
$("master").oninput = e => { masterBusy = Date.now(); $("mv").textContent = e.target.value; post("/api/alerts/volume", {volume:+e.target.value}); };
$("add").onclick = async () => { const q = $("q").value.trim(); if (!q) return; $("add").disabled = true;
  const r = await post("/api/music/add", {query:q}); $("add").disabled = false;
  if (r.ok) $("q").value = ""; else alert(r.error); };
$("q").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
$("stop").onclick = () => post("/api/alerts/stop");
async function tick() {
  try {
    const {data:s} = await (await fetch("/api/state", {cache:"no-store"})).json();
    if (document.documentElement.dataset.theme !== s.ui_theme) document.documentElement.dataset.theme = s.ui_theme;
    const m = s.music, c = m.current;
    $("now").textContent = c ? c.title : "—";
    $("like").textContent = c && c.liked ? "♥" : "♡"; $("like").classList.toggle("on", !!(c && c.liked)); $("like").disabled = !c;
    $("who").textContent = c ? (c.requester ? "Заказ: " + c.requester : "") + (c.paused ? " · пауза" : "") : "";
    if (Date.now() - volBusy > 1500) { $("vol").value = m.volume; $("volv").textContent = m.volume; }
    if (Date.now() - masterBusy > 1500) { $("master").value = s.alerts.volume; $("mv").textContent = s.alerts.volume; }
    $("queue").innerHTML = m.queue.map(t => `<li>${esc(t.title)} <span class="muted small">${esc(t.requester)}</span></li>`).join("") || '<span class="muted small">Очередь пуста</span>';
    $("apend").textContent = `В очереди алертов: ${s.alerts.pending}` + (s.alerts.current ? ` · показ: ${s.alerts.current.name}` : "") +
      (s.ready.alerts_source ? "" : " · источник /alerts не подключён");
  } catch (e) {}
}
async function alerts() {
  try {
    const {data} = await (await fetch("/api/alerts")).json();
    $("alist").innerHTML = data.items.map(a => `<div class="list-item"><span class="grow ellipsis">${esc(a.name)}</span>
      <input type="range" min="0" max="100" value="${a.volume}" data-id="${a.id}" style="width:110px"></div>`).join("") || '<span class="muted small">Алертов нет</span>';
    $("alist").querySelectorAll("input").forEach(i => i.oninput = () => post("/api/alerts/volume", {id:i.dataset.id, volume:+i.value}));
  } catch (e) {}
}
// История треков: последние 40, обновляется раз в 10 секунд, пока вкладка открыта
let HITEMS = [];
async function hist() {
  if ($("t-hist").classList.contains("hidden")) return;
  try {
    const {data} = await (await fetch("/api/music/history?limit=40&fallback=0&scope=" + $("hscope").value, {cache: "no-store"})).json();
    HITEMS = data.items;
    $("hlist").innerHTML = HITEMS.map(t => { const d = new Date(t.ts * 1000);
      return `<div class="h"><span class="t">${d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})}</span>
        <span class="n">${esc(t.title)}${t.requester ? `<div class="w">${esc(t.requester)}</div>` : ""}</span>
        <button class="sm" title="В очередь заново" data-i="${HITEMS.indexOf(t)}">＋</button></div>`; }).join("")
      || '<span class="muted small">Треков пока нет</span>';
    $("hlist").querySelectorAll("button[data-i]").forEach(b => b.onclick = async () => {
      const t = HITEMS[+b.dataset.i]; if (!t) return;
      b.disabled = true; b.textContent = "…";
      const r = await post("/api/music/add", {query: t.url || t.title});
      b.textContent = r.ok ? "✓" : "✗"; if (!r.ok) { b.disabled = false; alert(r.error); }
    });
  } catch (e) {}
}
$("hscope").onchange = hist;
$("hcopy").onclick = async () => {
  const text = HITEMS.slice().reverse().map(t => `${t.title}${t.requester ? " (" + t.requester + ")" : ""}${t.url ? " " + t.url : ""}`).join("\n");
  try { await navigator.clipboard.writeText(text); $("hcopy").textContent = "✓"; } catch (e) { $("hcopy").textContent = "✗"; }
  setTimeout(() => $("hcopy").textContent = "📋", 1500);
};
// Опросы и прогнозы: быстрый запуск по шаблону, живые результаты, управление
let V = null, VPICK = "", VBUSY = false;
const vnum = n => Math.round(n).toLocaleString("ru-RU");
const vleft = t => { const s = Math.max(0, Math.round(t - Date.now() / 1000)); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : s + " с"; };
async function vdo(url, body, ask) {
  if (VBUSY || (ask && !confirm(ask))) return; VBUSY = true;
  try { const r = await post("/api/votes/" + url, body); if (!r.ok) alert(r.error); else VPICK = ""; } finally { VBUSY = false; votes(); }
}
async function votes() {
  if ($("t-votes").classList.contains("hidden")) return;
  try { const j = await (await fetch("/api/votes", {cache: "no-store"})).json(); if (!j.ok) return; V = j.data; } catch (e) { return; }
  const w = [];
  if (!V.ready) w.push("Войдите в Twitch в программе");
  else if (!V.scopes.polls || !V.scopes.predictions) w.push("Нужны новые права: в программе нажмите «Войти в Twitch заново»");
  [V.poll_error, V.prediction_error].filter(Boolean).forEach(e => w.push(esc(e)));
  $("vwarn").innerHTML = w.map(x => `<div class="card small">⚠️ ${x}</div>`).join("");
  $("vtp").innerHTML = V.templates.polls.map((t, i) => `<button data-k="poll" data-i="${i}" title="${esc(t.choices.join(" / "))}">${esc(t.title)}</button>`).join("") || '<span class="muted small">нет шаблонов</span>';
  $("vtr").innerHTML = V.templates.predictions.map((t, i) => `<button data-k="pred" data-i="${i}" title="${esc(t.outcomes.join(" / "))}">${esc(t.title)}</button>`).join("") || '<span class="muted small">нет шаблонов</span>';
  document.querySelectorAll(".vtpl button[data-k]").forEach(b => b.onclick = () => {
    const t = (b.dataset.k === "poll" ? V.templates.polls : V.templates.predictions)[+b.dataset.i];
    if (b.dataset.k === "poll") vdo("poll/start", {title: t.title, choices: t.choices, duration: t.duration}, `Запустить опрос «${t.title}»?`);
    else vdo("prediction/start", {title: t.title, outcomes: t.outcomes, window: t.window}, `Запустить прогноз «${t.title}»?`);
  });
  const p = V.poll;
  if (!p) $("vlive-poll").classList.add("hidden");
  else {
    const max = Math.max(...p.choices.map(c => c.votes));
    $("vlive-poll").classList.remove("hidden");
    $("vlive-poll").innerHTML = `<div class="muted small">📊 Опрос · ${p.active ? "осталось " + vleft(p.ends) : "завершён"} · ${p.total} гол.</div><b>${esc(p.title)}</b>
      ${p.choices.map(c => `<div class="vr ${!p.active && max > 0 && c.votes === max ? "win" : ""}"><div class="tt"><span>${esc(c.title)}</span><span>${c.pct}% · ${c.votes}</span></div><div class="bb"><i style="width:${c.pct}%"></i></div></div>`).join("")}
      ${p.active ? `<button class="danger sm" id="vpend">⏹ Завершить</button>` : ""}`;
    if ($("vpend")) $("vpend").onclick = () => vdo("poll/end", {}, "Завершить опрос досрочно?");
  }
  const r = V.prediction, live = r && (r.active || r.locked);
  if (!r) $("vlive-pred").classList.add("hidden");
  else {
    $("vlive-pred").classList.remove("hidden");
    $("vlive-pred").innerHTML = `<div class="muted small">🔮 Прогноз · ${r.active ? "ставки " + vleft(r.locks) : r.locked ? "ставки закрыты" : r.status === "CANCELED" ? "отменён" : "завершён"} · ${vnum(r.total_points)} баллов</div><b>${esc(r.title)}</b>
      ${r.outcomes.map(o => `<div class="vr ${live ? "pick" : ""} ${o.id === VPICK ? "sel" : ""} ${r.winner === o.id ? "win" : ""}" data-o="${o.id}"><div class="tt"><span>${r.winner === o.id ? "🏆 " : ""}${esc(o.title)}</span><span>${o.pct}% · ${o.users} чел.</span></div><div class="bb"><i style="width:${o.pct}%"></i></div></div>`).join("")}
      ${live ? `<div class="row" style="margin-top:6px;flex-wrap:wrap">${r.active ? `<button class="sm" id="vlock">🔒 Закрыть ставки</button>` : ""}
        <button class="sm primary" id="vwin">🏆 Победитель</button><button class="sm danger" id="vcancel">Отмена</button></div>
        <div class="muted small" style="margin-top:4px">Нажмите на исход, затем «Победитель»</div>` : ""}`;
    $("vlive-pred").querySelectorAll(".vr.pick").forEach(el => el.onclick = () => { VPICK = el.dataset.o; votes(); });
    if ($("vlock")) $("vlock").onclick = () => vdo("prediction/lock");
    if ($("vcancel")) $("vcancel").onclick = () => vdo("prediction/cancel", {}, "Отменить прогноз и вернуть баллы?");
    if ($("vwin")) $("vwin").onclick = () => {
      const o = r.outcomes.find(x => x.id === VPICK); if (!o) return alert("Сначала нажмите на исход-победитель");
      vdo("prediction/resolve", {outcome_id: o.id}, `Победил «${o.title}»? Баллы будут выплачены.`);
    };
  }
  $("vstart").classList.toggle("hidden", !!((p && p.active) && live));
}
$("vgo").onclick = () => {
  const opts = $("vo").value.split("/").map(x => x.trim()).filter(Boolean), title = $("vq").value.trim(), d = +$("vdur").value;
  if ($("vkind").value === "poll") vdo("poll/start", {title, choices: opts, duration: d});
  else vdo("prediction/start", {title, outcomes: opts, window: d});
};
tick(); alerts(); setInterval(tick, 1500); setInterval(alerts, 30000); setInterval(hist, 10000); setInterval(votes, 2000);
</script>
</body>
</html>
