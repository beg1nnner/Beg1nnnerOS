<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="robots" content="noindex">
<title>Beg1nnnerOS — пульт</title>
<script src="/static/i18n.js"></script>
<style>
  @font-face { font-family:"Geist"; src:url("/fonts/Geist.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
  @font-face { font-family:"Geist Mono"; src:url("/fonts/GeistMono.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
  :root {
    --bg:#09090c; --panel:#111116; --panel2:#18181f; --line:rgba(255,255,255,.08); --fg:#f4f4f7; --muted:#b6b6c4; --dim:#9d9dae;
    --accent:#8b5cf6; --accent2:#c4b5fd; --ok:#34d399; --warn:#fbbf24; --err:#fb7185; --live:#f43f5e; --love:#f472b6; --on-accent:#fff;
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
    --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
    --t:.2s; --ease:cubic-bezier(.2,.8,.2,1);
    --font:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"Geist Mono", ui-monospace, monospace;
    color-scheme:dark;
  }
  html[data-theme="light"] { --bg:#f5f4f0; --panel:#fff; --panel2:#f1efea; --line:#e3e1da; --fg:#1b1b20; --muted:#4c4c58; --dim:#5a5a66;
    --accent:#6d28d9; --accent2:#5b21b6; --ok:#15803d; --warn:#a16207; --err:#be123c; --love:#be185d; color-scheme:light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:var(--fs-base)/1.45 var(--font); min-height:100vh;
    padding:calc(var(--sp-4) + env(safe-area-inset-top)) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom)); }
  .wrap { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:var(--sp-3); }
  header { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-1) 0 var(--sp-2); }
  .mark { width:36px; height:36px; border-radius:var(--r-md); display:grid; place-items:center; flex:none;
    background:color-mix(in srgb, var(--accent) 16%, var(--panel)); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); color:var(--accent2); }
  header .t { flex:1; min-width:0; display:flex; flex-direction:column; }
  header b { font-size:var(--fs-lg); font-weight:600; letter-spacing:-.01em; }
  header small { color:var(--dim); font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live { display:none; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-3); border-radius:var(--r-full); font:600 var(--fs-xs) var(--mono);
    color:color-mix(in srgb, var(--live) 70%, var(--fg)); background:color-mix(in srgb, var(--live) 12%, transparent); border:1px solid color-mix(in srgb, var(--live) 30%, transparent); }
  .live.on { display:inline-flex; } .live i { width:7px; height:7px; border-radius:var(--r-full); background:var(--live); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--sp-4); }
  .np-top { display:flex; flex-direction:column; gap:var(--sp-3); }
  #art { width:100%; aspect-ratio:16 / 9; object-fit:cover; border-radius:var(--r-md); background:var(--panel2); }
  .ovl { font:500 var(--fs-xs) var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--accent2); }
  .np-t { font-size:var(--fs-xl); font-weight:600; letter-spacing:-.02em; line-height:1.2; margin:var(--sp-2) 0 var(--sp-1); overflow-wrap:anywhere; }
  .np-w { color:var(--muted); font-size:var(--fs-md); min-height:18px; }
  .bar { height:4px; border-radius:var(--r-full); background:color-mix(in srgb, var(--fg) 12%, transparent); margin:var(--sp-4) 0 var(--sp-2); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width 1s linear; }
  .times { display:flex; justify-content:space-between; font:var(--fs-sm) var(--mono); color:var(--dim); font-variant-numeric:tabular-nums; }
  .ctl { display:flex; align-items:center; justify-content:center; gap:var(--sp-4); margin-top:var(--sp-4); }
  button { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-md); min-height:48px; padding:0 var(--sp-4);
    display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2); font-weight:500; cursor:pointer; transition:transform var(--t) var(--ease), background-color var(--t) var(--ease); }
  button:active { transform:scale(.96); }
  button:disabled { opacity:.4; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
  .rnd { width:56px; height:56px; padding:0; border-radius:var(--r-full); }
  .rnd.big { width:72px; height:72px; background:var(--fg); color:var(--bg); border-color:transparent; }
  .rnd.liked { color:var(--love); border-color:color-mix(in srgb, var(--love) 40%, transparent); background:color-mix(in srgb, var(--love) 12%, transparent); }
  .vol { display:flex; align-items:center; gap:var(--sp-3); margin-top:var(--sp-4); color:var(--dim); }
  .vol b { font:500 var(--fs-md) var(--mono); color:var(--fg); min-width:28px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:32px; background:none; --p:50%; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:var(--r-full);
    background:linear-gradient(to right, var(--accent) 0 var(--p), color-mix(in srgb, var(--fg) 14%, transparent) var(--p) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:var(--r-full); background:#fff; border:2px solid var(--accent); }
  input[type=range]::-moz-range-progress { height:6px; border-radius:var(--r-full); background:var(--accent); }
  input[type=range]::-moz-range-track { height:6px; border-radius:var(--r-full); background:color-mix(in srgb, var(--fg) 14%, transparent); }
  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--sp-3); }
  .tile { flex-direction:column; align-items:flex-start; justify-content:center; gap:var(--sp-1); min-height:72px; padding:var(--sp-3) var(--sp-4); text-align:left; }
  .tile small { color:var(--muted); font-weight:400; font-size:var(--fs-sm); }
  .tile.on { border-color:color-mix(in srgb, var(--warn) 45%, transparent); background:color-mix(in srgb, var(--warn) 10%, var(--panel2)); }
  .tile.danger { color:color-mix(in srgb, var(--err) 75%, var(--fg)); }
  h2 { font-size:var(--fs-lg); font-weight:600; margin:0 0 var(--sp-3); }
  .in { display:flex; gap:var(--sp-2); }
  input[type=text] { flex:1; min-width:0; min-height:48px; padding:0 var(--sp-4); border-radius:var(--r-md); border:1px solid var(--line); background:var(--panel2); color:var(--fg); font:inherit; font-size:var(--fs-lg); }
  .primary { background:var(--accent); border-color:transparent; color:var(--on-accent); font-weight:600; }
  .q { display:flex; flex-direction:column; gap:var(--sp-2); margin-top:var(--sp-3); }
  .q div { display:flex; gap:var(--sp-3); align-items:baseline; font-size:var(--fs-md); }
  .q span:first-child { font:var(--fs-sm) var(--mono); color:var(--dim); min-width:20px; }
  .q b { font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .q small { color:var(--dim); }
  .muted { color:var(--muted); font-size:var(--fs-md); }
  #toast { position:fixed; left:var(--sp-4); right:var(--sp-4); bottom:calc(var(--sp-4) + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; padding:var(--sp-3) var(--sp-4);
    border-radius:var(--r-md); background:var(--panel2); border:1px solid var(--line); box-shadow:0 12px 32px -12px rgba(0,0,0,.6); font-size:var(--fs-md);
    opacity:0; transform:translateY(8px); transition:opacity var(--t) var(--ease), transform var(--t) var(--ease); pointer-events:none; }
  #toast.show { opacity:1; transform:none; } #toast.err { border-color:color-mix(in srgb, var(--err) 45%, transparent); }
  .off { text-align:center; padding:var(--sp-6) var(--sp-4); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 8.5a5 5 0 000 7M15.5 8.5a5 5 0 010 7M5.5 5.5a9.5 9.5 0 000 13M18.5 5.5a9.5 9.5 0 010 13"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>
    <span class="t"><b>Пульт стрима</b><small id="ch">Beg1nnnerOS</small></span>
    <span class="live" id="live"><i></i><span>В ЭФИРЕ</span><span id="up"></span></span>
  </header>

  <div id="lost" class="card off" hidden><b>Нет связи с программой</b><p class="muted">Проверьте, что Beg1nnnerOS запущена, а телефон подключён к той же сети Wi-Fi.</p></div>

  <section class="card" aria-label="Сейчас играет">
    <div class="np-top"><img id="art" alt="" referrerpolicy="no-referrer" hidden onerror="this.hidden=true;ART_BAD.add(this.dataset.src)"><div class="ovl">Сейчас играет</div></div>
    <div class="np-t" id="title" data-noi18n>—</div>
    <div class="np-w" id="who"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="times"><span id="pos"></span><span id="left"></span></div>
    <div class="ctl">
      <button class="rnd" id="like" aria-label="В избранное" title="В избранное"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.8 5.6a5.4 5.4 0 00-7.7 0L12 6.7l-1.1-1.1a5.4 5.4 0 10-7.7 7.7L12 22l8.8-8.7a5.4 5.4 0 000-7.7z"/></svg></button>
      <button class="rnd big" id="pause" aria-label="Пауза / продолжить"><svg id="pause-ic" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="rnd" id="skip" aria-label="Пропустить трек" title="Пропустить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg></button>
    </div>
    <div class="vol"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
      <input type="range" id="vol" min="0" max="100" aria-label="Громкость музыки"><b id="volv"></b></div>
  </section>

  <div class="grid2">
    <button class="tile" id="pev"><b id="pev-t">Пауза уведомлений</b><small id="pev-s">алерты и события в чате</small></button>
    <button class="tile danger" id="stop"><b>Остановить алерты</b><small id="stop-s">очередь пуста</small></button>
    <button class="tile" id="block"><b>Заблокировать трек</b><small>и пропустить</small></button>
    <button class="tile" id="reload"><b>Обновить</b><small id="seen">—</small></button>
  </div>

  <section class="card" aria-label="Добавить трек">
    <h2>Добавить трек</h2>
    <form class="in" id="add-f"><input type="text" id="add" placeholder="Ссылка или «исполнитель — название»" autocomplete="off" aria-label="Ссылка или название трека"><button class="primary" type="submit">Добавить</button></form>
    <div class="q" id="queue"></div>
  </section>

  <section class="card" aria-label="Сообщение в чат" id="chat-card">
    <h2>Сообщение в чат</h2>
    <form class="in" id="chat-f"><input type="text" id="chat" placeholder="Написать в чат…" autocomplete="off" maxlength="450" aria-label="Сообщение в чат"><button class="primary" type="submit">Отправить</button></form>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = id => document.getElementById(id);
const ART_BAD = new Set();
const T = s => (window.tr ? window.tr(s) : s);
const KEY = new URLSearchParams(location.search).get("k") || "";
const fmt = s => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
let toastT;
function toast(text, err) { const t = $("toast"); t.textContent = T(text); t.className = "show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "", 2600); }
async function call(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-Key": KEY, "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined, cache: "no-store"});
  const j = await r.json().catch(() => ({ok: false, error: r.statusText}));
  if (!j.ok) throw new Error(j.error || "Не получилось");
  return j.data;
}
async function act(action, extra) {
  try { const d = await call("/api/act", Object.assign({action}, extra || {})); if (d && d.message) toast(d.message); tick(); return true; }
  catch (e) { toast(e.message, true); return false; }
}
let volBusy = 0, S = null, lastOk = 0;
async function tick() {
  let d;
  try { d = await call("/api/state"); lastOk = Date.now(); $("lost").hidden = true; }
  catch (e) { if (Date.now() - lastOk > 5000) $("lost").hidden = false; return; }
  S = d;
  document.documentElement.dataset.theme = d.theme === "light" ? "light" : "";
  $("ch").textContent = d.channel ? "twitch.tv/" + d.channel : "Beg1nnnerOS";
  $("live").classList.toggle("on", !!d.live); $("up").textContent = d.live ? d.uptime : "";
  const m = d.music, c = m.current;
  $("title").textContent = c ? c.title : T("Сейчас ничего не играет");
  const art = c && c.cover && !ART_BAD.has(c.cover) ? c.cover : "";
  if ($("art").dataset.src !== art) { $("art").dataset.src = art; if (art) $("art").src = art; }
  $("art").hidden = !art;
  $("who").textContent = c ? (c.requester ? T("Заказ: ") + c.requester : T("Добавлен вручную")) + (c.paused ? " · " + T("пауза") : "") : "";
  $("bar").style.width = c && c.duration ? Math.min(100, c.position / c.duration * 100) + "%" : "0";
  $("pos").textContent = c ? fmt(c.position) : ""; $("left").textContent = c && c.duration ? "−" + fmt(c.duration - c.position) : "";
  ["like", "pause", "skip", "block"].forEach(id => $(id).disabled = !c);
  $("like").classList.toggle("liked", !!(c && c.liked));
  $("pause-ic").innerHTML = c && c.paused ? '<path d="M7 4.5v15l12-7.5z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  if (Date.now() - volBusy > 1500) { $("vol").value = m.volume; $("volv").textContent = m.volume; fill(); }
  $("pev").classList.toggle("on", !!d.paused_events);
  $("pev-t").textContent = T(d.paused_events ? "Уведомления на паузе" : "Пауза уведомлений");
  $("pev-s").textContent = T(d.paused_events ? "нажмите, чтобы продолжить" : "алерты и события в чате");
  $("stop-s").textContent = d.alerts_pending ? T("в очереди: ") + d.alerts_pending : T("очередь пуста");
  $("seen").textContent = T("обновлено ") + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  $("chat-card").hidden = !d.can_chat;
  const q = m.queue.slice(0, 5);
  $("queue").innerHTML = q.length ? q.map((t, i) => `<div><span>${String(i + 1).padStart(2, "0")}</span><b data-noi18n></b><small data-noi18n></small></div>`).join("") + (m.queue.length > 5 ? `<div><span></span><small>${T("и ещё")} ${m.queue.length - 5}</small></div>` : "")
    : `<span class="muted">${T("Очередь пуста")}</span>`;
  [...$("queue").querySelectorAll("div")].slice(0, q.length).forEach((el, i) => { el.querySelector("b").textContent = q[i].title; el.querySelector("small").textContent = q[i].requester || ""; });
}
function fill() { const v = $("vol"); v.style.setProperty("--p", v.value + "%"); }
$("pause").onclick = () => act("pause");
$("skip").onclick = () => act("skip");
$("like").onclick = () => act("like");
$("block").onclick = () => { if (confirm(T("Заблокировать текущий трек и пропустить его?"))) act("block"); };
$("pev").onclick = () => act("pause_events");
$("stop").onclick = () => act("stop_alerts");
$("reload").onclick = () => tick();
let volT;
$("vol").oninput = e => { volBusy = Date.now(); $("volv").textContent = e.target.value; fill(); clearTimeout(volT); volT = setTimeout(() => act("volume", {value: +e.target.value}), 150); };
$("add-f").onsubmit = async e => { e.preventDefault(); const v = $("add").value.trim(); if (!v) return; toast("Ищу трек…"); if (await act("add", {query: v})) $("add").value = ""; };
$("chat-f").onsubmit = async e => { e.preventDefault(); const v = $("chat").value.trim(); if (!v) return; if (await act("chat", {text: v})) $("chat").value = ""; };
tick(); setInterval(tick, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
